[project]
name = "chatgpt2api-image-studio"
version = "0.1.0"
description = "A lightweight desktop image-generation client for chatgpt2api."
requires-python = ">=3.10"
dependencies = [
    "customtkinter>=5.2.2",
    "httpx>=0.27.0",
    "Pillow>=10.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pyinstaller>=6.0.0",
]

[project.scripts]
image-studio = "image_studio.app:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
